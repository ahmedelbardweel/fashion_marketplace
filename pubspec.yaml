name: fashion_marketplace
description: Fashion marketplace with AR try-on, multi-role access.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path: ^1.9.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  image_background_remover: ^2.0.1
  camera: ^0.12.2
  google_mlkit_pose_detection: ^0.12.0
  flutter_webrtc: ^0.12.5
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  skeletonizer: ^3.0.0
  iconsax_plus: ^1.0.0
  font_awesome_flutter: ^10.8.0
  google_sign_in: ^6.2.2
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  web: ^1.1.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/app_logo.png
    - assets/models/pose_landmarker_lite.task
