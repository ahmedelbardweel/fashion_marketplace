name: Build Android APK and iPhone IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Configure public client environment
        shell: bash
        run: cp config/mobile.env .env
      - name: Select Xcode 26 for Swift 6.2.1+
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
            [ -n "$LATEST_XCODE" ] && sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version
      - name: Enable Swift Package Manager for iOS
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          flutter config --enable-swift-package-manager
          rm -rf ios/Pods ios/Podfile.lock
      - name: Install dependencies
        run: flutter pub get
      - name: Test virtual try-on
        if: matrix.platform == 'android'
        run: flutter test test/virtual_tryon/decart_vton_sdk_service_test.dart test/virtual_tryon/decart_service_test.dart test/virtual_tryon/tryon_controller_test.dart test/virtual_tryon/web_camera_test.dart
      - name: Configure Gradle for CI
        if: matrix.platform == 'android'
        shell: bash
        run: |
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m
          kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.vfs.watch=false
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF
      - name: Build Android APK
        if: matrix.platform == 'android'
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Work around broken download.onnxruntime.ai target on iOS CI
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          if curl -fsSI --max-time 15 "https://download.onnxruntime.ai/pod-archive-onnxruntime-extensions-c-0.13.0.zip" >/dev/null 2>&1; then
            echo "download.onnxruntime.ai is reachable; using upstream SwiftPM directly."
            exit 0
          fi
          echo "::warning::download.onnxruntime.ai is unreachable (HTTP 404 / TLS); preparing local SwiftPM mirror for onnxruntime-swift-package-manager without unused onnxruntime_extensions."
          python3 -u - << 'PY'
          import json, os, re, shutil, subprocess

          temp_dir = os.environ["RUNNER_TEMP"]
          # Directory name MUST stay "onnxruntime-swift-package-manager" so SwiftPM
          # derives the exact package identity expected by .product(..., package: "onnxruntime-swift-package-manager").
          repo_dir = os.path.join(temp_dir, "onnxruntime-swift-package-manager")
          if os.path.exists(repo_dir):
              shutil.rmtree(repo_dir)

          # Auto-discover the onnxruntime-swift-package-manager URL, pinned tags,
          # consumer manifests, and whether any consumer uses onnxruntime_extensions.
          url_re = re.compile(r'https://github\.com/[A-Za-z0-9_.-]+/onnxruntime-swift-package-manager(?:\.git)?')
          pin_re = re.compile(r'onnxruntime-swift-package-manager(?:\.git)?"\s*,\s*(?:exact|from)\s*:\s*"([^"]+)"')
          pkg_dep_re = re.compile(
              r'\.package\(\s*url\s*:\s*"https://github\.com/[A-Za-z0-9_.-]+/onnxruntime-swift-package-manager(?:\.git)?"\s*,\s*(?:exact|from)\s*:\s*"[^"]+"\s*\)'
          )
          found_urls = set()
          pinned_tags = []
          consumer_manifests = []
          uses_extensions = False
          search_roots = [
              os.path.expanduser("~/.pub-cache"),
              os.path.join(os.getcwd(), "ios"),
          ]
          for root_dir in search_roots:
              if not os.path.isdir(root_dir):
                  continue
              for r, _, files in os.walk(root_dir):
                  for fn in files:
                      if fn == "Package.swift":
                          p = os.path.join(r, fn)
                          try:
                              txt = open(p, "r", encoding="utf-8", errors="ignore").read()
                          except OSError:
                              continue
                          matches = url_re.findall(txt)
                          if not matches:
                              continue
                          found_urls.update(matches)
                          consumer_manifests.append(p)
                          for ver in pin_re.findall(txt):
                              if ver not in pinned_tags:
                                  pinned_tags.append(ver)
                          if '"onnxruntime_extensions"' in txt:
                              uses_extensions = True

          if not found_urls:
              raise RuntimeError("Could not locate onnxruntime-swift-package-manager URL in Package.swift files")
          if uses_extensions:
              raise RuntimeError("A dependency requires onnxruntime_extensions, whose upstream download.onnxruntime.ai archive is unreachable")

          raw_url = sorted(found_urls)[0]
          base_url = raw_url[:-4] if raw_url.endswith(".git") else raw_url
          clone_url = base_url + ".git"
          print(f"Discovered onnxruntime SPM repo: {clone_url} (pinned tags: {pinned_tags})")

          env = dict(os.environ, GIT_TERMINAL_PROMPT="0")
          subprocess.run(["git", "clone", clone_url, repo_dir], check=True, env=env)
          subprocess.run(["git", "-C", repo_dir, "config", "user.email", "ci@local"], check=True)
          subprocess.run(["git", "-C", repo_dir, "config", "user.name", "CI"], check=True)

          tags_out = subprocess.check_output(
              ["git", "-C", repo_dir, "tag", "--sort=-v:refname"], text=True
          )
          all_tags = [t.strip() for t in tags_out.splitlines() if t.strip()]
          candidate_tags = [t for t in pinned_tags if t in all_tags] + [
              t for t in all_tags[:8] if t not in pinned_tags
          ]

          prune_snippet = (
              "\n// CI: prune unused onnxruntime_extensions targets whose upstream download.onnxruntime.ai URL is unreachable\n"
              "package.products.removeAll { $0.name == \"onnxruntime_extensions\" }\n"
              "package.targets.removeAll {\n"
              "    $0.name == \"onnxruntime_extensions\"\n"
              "        || $0.name == \"OnnxRuntimeExtensions\"\n"
              "        || $0.name == \"OnnxRuntimeExtensionsTests\"\n"
              "}\n"
          )

          def patch_tag(tag: str) -> bool:
              subprocess.run(["git", "-C", repo_dir, "checkout", "-f", tag], check=True)
              subprocess.run(["git", "-C", repo_dir, "clean", "-fd"], check=True)
              pkg_path = os.path.join(repo_dir, "Package.swift")
              if not os.path.exists(pkg_path):
                  return False

              dump_raw = subprocess.check_output(
                  ["swift", "package", "dump-package"], cwd=repo_dir, text=True
              )
              manifest = json.loads(dump_raw)
              dead_targets = [
                  t for t in manifest.get("targets", [])
                  if t.get("type") == "binary"
                  and isinstance(t.get("url"), str)
                  and "download.onnxruntime.ai/" in t["url"]
              ]
              dead_names = {t["name"] for t in dead_targets}
              if not dead_names:
                  print(f"Tag {tag} already has no download.onnxruntime.ai binary targets.")
                  return True

              if dead_names != {"onnxruntime_extensions"}:
                  print(f"Skipping tag {tag}: still depends on download.onnxruntime.ai for {sorted(dead_names)}")
                  return False

              with open(pkg_path, "a", encoding="utf-8") as f:
                  f.write(prune_snippet)

              verified_raw = subprocess.check_output(
                  ["swift", "package", "dump-package"], cwd=repo_dir, text=True
              )
              verified = json.loads(verified_raw)
              remaining_dead = [
                  t["name"] for t in verified.get("targets", [])
                  if isinstance(t.get("url"), str) and "download.onnxruntime.ai/" in t["url"]
              ]
              if remaining_dead:
                  raise RuntimeError(f"Tag {tag} still has download.onnxruntime.ai targets after patch: {remaining_dead}")

              ort_bins = [
                  (t["name"], t.get("url")) for t in verified.get("targets", [])
                  if t.get("type") == "binary"
              ]
              if not any(name == "onnxruntime" for name, _ in ort_bins):
                  raise RuntimeError(f"Tag {tag} lost required onnxruntime binary target after patch")

              subprocess.run(["git", "-C", repo_dir, "add", "Package.swift"], check=True)
              subprocess.run(
                  ["git", "-C", repo_dir, "commit", "-m", f"ci: prune unreachable onnxruntime_extensions for {tag}"],
                  check=True,
              )
              subprocess.run(["git", "-C", repo_dir, "tag", "-f", tag], check=True)
              print(f"Successfully patched tag {tag}; remaining binary targets: {ort_bins}")
              return True

          patched_tags = []
          for tag in candidate_tags:
              try:
                  if patch_tag(tag):
                      patched_tags.append(tag)
                      if pinned_tags and all(p in patched_tags for p in pinned_tags):
                          break
              except Exception as exc:
                  print(f"Skipping tag {tag}: {exc}")
                  subprocess.run(["git", "-C", repo_dir, "reset", "--hard"], check=False)
                  subprocess.run(["git", "-C", repo_dir, "clean", "-fd"], check=False)

          if not patched_tags or (pinned_tags and not all(p in patched_tags for p in pinned_tags)):
              raise RuntimeError(
                  f"Failed to patch required onnxruntime-spm tags (pinned={pinned_tags}, patched={patched_tags})"
              )

          # Leave the local repo checked out on the primary patched tag for local path resolution
          subprocess.run(["git", "-C", repo_dir, "checkout", "-f", patched_tags[0]], check=True)

          # Rewrite consumer manifests (e.g. flutter_onnxruntime) to use the local path package
          # directly so Xcode's built-in SwiftPM SCM provider never hits the broken remote manifest.
          manifest_list_file = os.path.join(temp_dir, "ort-patched-manifests.txt")
          patched_manifests = []
          for p in consumer_manifests:
              txt = open(p, "r", encoding="utf-8").read()
              new_txt, count = pkg_dep_re.subn(f'.package(path: "{repo_dir}")', txt)
              if count > 0:
                  bak = p + ".ci-bak"
                  if not os.path.exists(bak):
                      shutil.copy2(p, bak)
                  with open(p, "w", encoding="utf-8") as f:
                      f.write(new_txt)
                  subprocess.run(
                      ["swift", "package", "dump-package"],
                      cwd=os.path.dirname(p),
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
                  patched_manifests.append(p)
                  print(f"Pointed {p} directly to local SwiftPM package {repo_dir}")

          with open(manifest_list_file, "w", encoding="utf-8") as f:
              for p in patched_manifests:
                  f.write(p + "\n")

          # Also configure git url.insteadOf as a belt-and-suspenders fallback
          subprocess.run(["git", "config", "--global", "protocol.file.allow", "always"], check=True)
          subprocess.run(["git", "config", "--global", "--add", f"url.file://{repo_dir}.insteadOf", base_url + ".git"], check=True)
          subprocess.run(["git", "config", "--global", "--add", f"url.file://{repo_dir}.insteadOf", base_url], check=True)

          # Verify Git rewrite points the upstream URL to our patched local tag
          local_sha = subprocess.check_output(["git", "-C", repo_dir, "rev-parse", patched_tags[0]], text=True).strip()
          resolved_out = subprocess.check_output(["git", "ls-remote", base_url, f"refs/tags/{patched_tags[0]}"], text=True, env=env).strip()
          print(f"Verified insteadOf redirect for {base_url} tag {patched_tags[0]}: {resolved_out} (expected {local_sha})")
          if local_sha not in resolved_out:
              raise RuntimeError("git url.insteadOf redirect verification failed")
          PY
      - name: Build iPhone app without signing
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/ios-build-$attempt.log"
            if flutter build ios --release --no-codesign --build-number=${{ github.run_number }} > "$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              build_status=$?
            fi
            cat "$log_file"
            if [ "$attempt" -eq 3 ] || ! grep -Eiq 'badResponseStatusCode\((429|500|502|503|504)\)|The request timed out|Could not resolve host|Connection reset by peer' "$log_file"; then
              exit "$build_status"
            fi
            echo "::warning::Transient dependency download failure; retrying iOS build ($attempt/3)."
            sleep $((attempt * 20))
          done
      - name: Restore patched Pub cache manifests
        if: always() && matrix.platform == 'ios'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/ort-patched-manifests.txt" ]; then
            while IFS= read -r p; do
              [ -f "$p.ci-bak" ] && mv -f "$p.ci-bak" "$p"
            done < "$RUNNER_TEMP/ort-patched-manifests.txt"
          fi
      - name: Package iPhone IPA for external signing
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          mkdir -p build/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -r -q fashion_marketplace-unsigned.ipa Payload
          echo 'Requires Apple signing before installation (for example Sideloadly). Not a TestFlight export.' > SIGNING_REQUIRED.txt
      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: fashion-marketplace-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload iPhone IPA
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: fashion-marketplace-iphone-unsigned-ipa
          path: |
            build/ipa/fashion_marketplace-unsigned.ipa
            build/ipa/SIGNING_REQUIRED.txt
          if-no-files-found: error
          retention-days: 14
