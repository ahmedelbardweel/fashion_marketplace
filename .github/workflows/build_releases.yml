name: Build Android APK and iPhone IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Configure public client environment
        shell: bash
        run: cp config/mobile.env .env
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test virtual try-on
        if: matrix.platform == 'android'
        run: flutter test test/virtual_tryon/decart_service_test.dart test/virtual_tryon/tryon_controller_test.dart test/virtual_tryon/web_camera_test.dart
      - name: Build Android APK
        if: matrix.platform == 'android'
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Build iPhone app without signing
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/ios-build-$attempt.log"
            if flutter build ios --release --no-codesign --build-number=${{ github.run_number }} > "$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              build_status=$?
            fi
            cat "$log_file"
            if [ "$attempt" -eq 3 ] || ! grep -Eiq 'badResponseStatusCode\((429|500|502|503|504)\)|The request timed out|Could not resolve host|Connection reset by peer' "$log_file"; then
              exit "$build_status"
            fi
            echo "::warning::Transient dependency download failure; retrying iOS build ($attempt/3)."
            sleep $((attempt * 20))
          done
      - name: Package iPhone IPA for external signing
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          mkdir -p build/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -r -q fashion_marketplace-unsigned.ipa Payload
          echo 'Requires Apple signing before installation (for example Sideloadly). Not a TestFlight export.' > SIGNING_REQUIRED.txt
      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: fashion-marketplace-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload iPhone IPA
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: fashion-marketplace-iphone-unsigned-ipa
          path: |
            build/ipa/fashion_marketplace-unsigned.ipa
            build/ipa/SIGNING_REQUIRED.txt
          if-no-files-found: error
          retention-days: 14
