name: Build Releases (APK & IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Environment Variables
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "SUPABASE_URL=https://yjuuvsjhpoghqlndclpr.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqdXV2c2pocG9naHFsbmRjbHByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2ODk3NjUsImV4cCI6MjEwOTI2NTc2NX0.WYIdy5SLnKJdNEjs30i5KC_lBscag5gmM2BMbjKSvEU" >> .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: fashion-marketplace-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Environment Variables
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "SUPABASE_URL=https://yjuuvsjhpoghqlndclpr.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqdXV2c2pocG9naHFsbmRjbHByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2ODk3NjUsImV4cCI6MjEwOTI2NTc2NX0.WYIdy5SLnKJdNEjs30i5KC_lBscag5gmM2BMbjKSvEU" >> .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q fashion_marketplace.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: fashion-marketplace-ios-ipa
          path: fashion_marketplace.ipa
          if-no-files-found: error
