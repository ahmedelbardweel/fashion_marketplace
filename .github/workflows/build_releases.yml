name: Build Android APK and iPhone IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Configure public client environment
        shell: bash
        run: cp config/mobile.env .env
      - name: Select Xcode 26 for Swift 6.2.1+
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
            [ -n "$LATEST_XCODE" ] && sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version
      - name: Enable Swift Package Manager for iOS
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          flutter config --enable-swift-package-manager
          rm -rf ios/Pods ios/Podfile.lock
      - name: Install dependencies
        run: flutter pub get
      - name: Test virtual try-on
        if: matrix.platform == 'android'
        run: flutter test test/virtual_tryon/decart_vton_sdk_service_test.dart test/virtual_tryon/decart_service_test.dart test/virtual_tryon/tryon_controller_test.dart test/virtual_tryon/web_camera_test.dart
      - name: Configure Gradle for CI
        if: matrix.platform == 'android'
        shell: bash
        run: |
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m
          kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          org.gradle.vfs.watch=false
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF
      - name: Build Android APK
        if: matrix.platform == 'android'
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Work around invalid download.onnxruntime.ai TLS cert on iOS CI
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          if curl -fsSI --max-time 15 "https://download.onnxruntime.ai/pod-archive-onnxruntime-extensions-c-0.13.0.zip" >/dev/null 2>&1; then
            echo "download.onnxruntime.ai TLS certificate is valid; using upstream SwiftPM directly."
            exit 0
          fi
          echo "::warning::download.onnxruntime.ai TLS verification failed; preparing SHA-256-verified local SwiftPM mirror for onnxruntime-swift-package-manager."
          python3 - << 'PY'
          import glob, hashlib, os, re, shutil, subprocess, zipfile

          temp_dir = os.environ["RUNNER_TEMP"]
          repo_dir = os.path.join(temp_dir, "onnxruntime-spm")
          zip_cache = os.path.join(temp_dir, "ort-zips")
          os.makedirs(zip_cache, exist_ok=True)
          if os.path.exists(repo_dir):
              shutil.rmtree(repo_dir)

          # Auto-discover the exact onnxruntime-swift-package-manager repo URL from Pub cache / ios
          url_re = re.compile(r'https://github\.com/[A-Za-z0-9_.-]+/onnxruntime-swift-package-manager(?:\.git)?')
          found_urls = set()
          search_roots = [
              os.path.expanduser("~/.pub-cache"),
              os.path.join(os.getcwd(), "ios"),
          ]
          for root_dir in search_roots:
              if not os.path.isdir(root_dir):
                  continue
              for r, _, files in os.walk(root_dir):
                  for fn in files:
                      if fn == "Package.swift":
                          p = os.path.join(r, fn)
                          try:
                              txt = open(p, "r", encoding="utf-8", errors="ignore").read()
                              for m in url_re.findall(txt):
                                  found_urls.add(m)
                          except OSError:
                              pass

          if not found_urls:
              raise RuntimeError("Could not locate onnxruntime-swift-package-manager URL in Package.swift files")

          raw_url = sorted(found_urls)[0]
          base_url = raw_url[:-4] if raw_url.endswith(".git") else raw_url
          clone_url = base_url + ".git"
          print(f"Discovered onnxruntime SPM repo: {clone_url}")

          env = dict(os.environ, GIT_TERMINAL_PROMPT="0")
          subprocess.run(["git", "clone", clone_url, repo_dir], check=True, env=env)
          subprocess.run(["git", "-C", repo_dir, "config", "user.email", "ci@local"], check=True)
          subprocess.run(["git", "-C", repo_dir, "config", "user.name", "CI"], check=True)

          tags_out = subprocess.check_output(
              ["git", "-C", repo_dir, "tag", "--sort=-v:refname"], text=True
          )
          all_tags = [t.strip() for t in tags_out.splitlines() if t.strip()]

          pattern = re.compile(
              r'url\s*:\s*"(https://download\.onnxruntime\.ai/[^"]+\.zip)"\s*,\s*checksum\s*:\s*"([0-9a-fA-F]{64})"',
              re.DOTALL,
          )

          def ensure_zip(url: str, expected_sha: str) -> str:
              fname = os.path.basename(url)
              zpath = os.path.join(zip_cache, fname)
              if not os.path.exists(zpath):
                  print(f"Downloading {url} ...")
                  subprocess.run(
                      ["curl", "-fsSLk", "--retry", "3", "-o", zpath, url],
                      check=True,
                  )
              h = hashlib.sha256()
              with open(zpath, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              actual = h.hexdigest().lower()
              if actual != expected_sha.lower():
                  raise RuntimeError(f"SHA256 mismatch for {url}: expected {expected_sha}, got {actual}")
              print(f"Verified SHA256 for {fname}: {actual}")
              return zpath

          def patch_ref(ref_name: str, is_tag: bool) -> bool:
              subprocess.run(["git", "-C", repo_dir, "checkout", "-f", ref_name], check=True)
              pkg_path = os.path.join(repo_dir, "Package.swift")
              if not os.path.exists(pkg_path):
                  return False
              content = open(pkg_path, "r", encoding="utf-8").read()
              matches = list(pattern.finditer(content))
              if not matches:
                  return False

              local_root = os.path.join(repo_dir, "local_xcframeworks")
              if os.path.exists(local_root):
                  shutil.rmtree(local_root)
              os.makedirs(local_root, exist_ok=True)

              new_content = content
              for idx, m in enumerate(matches):
                  url, sha = m.group(1), m.group(2)
                  zpath = ensure_zip(url, sha)
                  extract_dir = os.path.join(local_root, f"art_{idx}")
                  os.makedirs(extract_dir, exist_ok=True)
                  with zipfile.ZipFile(zpath, "r") as zf:
                      zf.extractall(extract_dir)
                  xcf_rel = None
                  for root, dirs, _ in os.walk(extract_dir):
                      for d in dirs:
                          if d.endswith(".xcframework"):
                              xcf_rel = os.path.relpath(os.path.join(root, d), repo_dir).replace("\\", "/")
                              break
                      if xcf_rel:
                          break
                  if not xcf_rel:
                      raise RuntimeError(f"No .xcframework found inside {zpath}")
                  new_content = new_content.replace(m.group(0), f'path: "{xcf_rel}"', 1)

              with open(pkg_path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              subprocess.run(["git", "-C", repo_dir, "add", "-f", "Package.swift", "local_xcframeworks"], check=True)
              subprocess.run(["git", "-C", repo_dir, "commit", "-m", f"ci: vendor verified xcframeworks for {ref_name}"], check=True)
              if is_tag:
                  subprocess.run(["git", "-C", repo_dir, "tag", "-f", ref_name], check=True)
              return True

          patched = 0
          for tag in all_tags[:8]:
              if patch_ref(tag, is_tag=True):
                  patched += 1
          print(f"Patched {patched} tags in local onnxruntime-spm mirror.")

          subprocess.run(["git", "config", "--global", "--add", f"url.file://{repo_dir}.insteadOf", base_url + ".git"], check=True)
          subprocess.run(["git", "config", "--global", "--add", f"url.file://{repo_dir}.insteadOf", base_url], check=True)
          PY
      - name: Build iPhone app without signing
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/ios-build-$attempt.log"
            if flutter build ios --release --no-codesign --build-number=${{ github.run_number }} > "$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              build_status=$?
            fi
            cat "$log_file"
            if [ "$attempt" -eq 3 ] || ! grep -Eiq 'badResponseStatusCode\((429|500|502|503|504)\)|The request timed out|Could not resolve host|Connection reset by peer' "$log_file"; then
              exit "$build_status"
            fi
            echo "::warning::Transient dependency download failure; retrying iOS build ($attempt/3)."
            sleep $((attempt * 20))
          done
      - name: Package iPhone IPA for external signing
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          mkdir -p build/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -r -q fashion_marketplace-unsigned.ipa Payload
          echo 'Requires Apple signing before installation (for example Sideloadly). Not a TestFlight export.' > SIGNING_REQUIRED.txt
      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: fashion-marketplace-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload iPhone IPA
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: fashion-marketplace-iphone-unsigned-ipa
          path: |
            build/ipa/fashion_marketplace-unsigned.ipa
            build/ipa/SIGNING_REQUIRED.txt
          if-no-files-found: error
          retention-days: 14
